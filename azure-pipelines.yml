trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  imageRepository: zenflow
  containerRegistry: careeracr12345.azurecr.io
  tag: $(Build.BuildId)

steps:

- task: NodeTool@0
  inputs:
    versionSpec: '22.x'

- script: |
    npm install
    npm run build
  displayName: Build Application

- task: SonarQubePrepare@7
  inputs:
    SonarQube: 'sonarqube-connection'
    scannerMode: 'CLI'
    configMode: 'manual'
    cliProjectKey: 'zenflow-dashboard'
    cliProjectName: 'Zenflow Dashboard'
    cliSources: '.'

- task: SonarQubeAnalyze@7

- task: SonarQubePublish@7
  inputs:
    pollingTimeoutSec: '300'

- task: Docker@2
  displayName: Build and Push Image
  inputs:
    command: buildAndPush
    repository: zenflow
    dockerfile: dockerfile
    containerRegistry: careeracr12345-acr
    tags: |
      $(Build.BuildId)

- task: KubernetesManifest@1
  displayName: Deploy to AKS
  inputs:
    action: deploy
    kubernetesServiceConnection: 'zenflow-aks-connection'
    manifests: |
      deployment.yaml
      service.yaml