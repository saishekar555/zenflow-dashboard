apiVersion: apps/v1
kind: Deployment

metadata:
  name: zenflow

spec:
  replicas: 2

  selector:
    matchLabels:
      app: zenflow

  template:
    metadata:
      labels:
        app: zenflow

    spec:
      containers:
      - name: zenflow
        image: careeracr12345.azurecr.io/zenflow:v1

        ports:
        - containerPort: 80